<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="description" content="用草图描述仿真的约束、载荷和待确认方向。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>SimSketch · 仿真草图</title>
</head>
<body>
  <svg class="icon-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l1-5L16 4a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L9 19Z"/></symbol>
    <symbol id="i-region" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14m-4 0h8"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="m5 4 15 8-7 1-3 7Z"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
    <symbol id="i-arc" viewBox="0 0 24 24"><path d="M4 17A9 9 0 0 1 20 9"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 5-4 4 4 4M4 9h11a5 5 0 0 1 0 10h-2"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 5 4 4-4 4m4-4H9a5 5 0 0 0 0 10h2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.4"/><path d="m4 17 5-4 4 3 4-5 4 4"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>
  <main class="workspace" inert>
    <div class="board-wrap">
      <canvas id="gpu-board" aria-hidden="true"></canvas>
      <svg id="board" viewBox="0 0 960 600" aria-label="绘图区域" role="img" xmlns="http://www.w3.org/2000/svg"></svg>
      <input id="canvas-text" type="text" maxlength="140" aria-label="画布文字" placeholder="输入文字" hidden>
    </div>
    <div class="top-left floating">
      <div class="brand"><img src="./icon.svg" width="30" height="30" alt=""><strong>SimSketch</strong></div>
      <span class="separator"></span>
      <details class="menu">
        <summary title="文件菜单">文件</summary>
        <div class="menu-popup align-left"><button id="new">新建空白</button><button id="demo">支架示例</button><button id="import">导入图片</button><button id="export-png">导出 PNG</button><button id="export-svg">导出 SVG</button><button id="export-json">导出 JSON</button><button id="install">安装应用</button></div>
      </details>
      <input id="image-file" type="file" accept="image/*" hidden>
      <span class="separator"></span>
      <div class="history" role="group" aria-label="绘图历史">
        <button class="icon-action" id="undo" title="撤销" aria-label="撤销"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button class="icon-action" id="redo" title="重做" aria-label="重做"><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
      </div>
    </div>
    <div class="top-right">
      <span id="status" role="status">正在读取草稿…</span>
      <button id="copy-image" class="floating" title="复制画布图片" aria-label="复制画布图片"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span>复制图片</span></button>
      <button id="toggle-layers" class="floating" aria-expanded="false" aria-controls="layers-panel">图层</button>
      <button id="toggle-inspector" class="floating" aria-expanded="false" aria-controls="inspector">标注 <span id="annotation-count">0</span></button>
    </div>
    <div class="tool-group floating" role="group" aria-label="绘图工具">
      <button data-tool="select" aria-pressed="false" title="选择及编辑标注" aria-label="选择"><svg class="icon" aria-hidden="true"><use href="#i-select"/></svg><span>选择</span></button>
      <button data-tool="line" aria-pressed="false" title="直线" aria-label="直线"><svg class="icon" aria-hidden="true"><use href="#i-line"/></svg><span>直线</span></button>
      <button data-tool="rect" aria-pressed="false" title="矩形" aria-label="矩形"><svg class="icon" aria-hidden="true"><use href="#i-rect"/></svg><span>矩形</span></button>
      <button data-tool="circle" aria-pressed="false" title="圆" aria-label="圆"><svg class="icon" aria-hidden="true"><use href="#i-circle"/></svg><span>圆</span></button>
      <button data-tool="arc" aria-pressed="false" title="圆弧" aria-label="圆弧"><svg class="icon" aria-hidden="true"><use href="#i-arc"/></svg><span>圆弧</span></button>
      <button data-tool="pen" aria-pressed="true" title="画笔" aria-label="画笔"><svg class="icon" aria-hidden="true"><use href="#i-pen"/></svg><span>画笔</span></button>
      <button data-tool="region" aria-pressed="false" title="圈选区域" aria-label="圈选"><svg class="icon" aria-hidden="true"><use href="#i-region"/></svg><span>圈选</span></button>
      <button data-tool="arrow" aria-pressed="false" title="画载荷箭头" aria-label="箭头"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><span>箭头</span></button>
      <button data-tool="text" aria-pressed="false" title="文字" aria-label="文字"><svg class="icon" aria-hidden="true"><use href="#i-text"/></svg><span>文字</span></button>
    </div>
    <section class="palette-panel floating" aria-label="画笔颜色">
      <div class="palette-heading"><span>画笔颜色</span><strong id="brush-label">自动</strong></div>
      <div class="color-wells"><div id="preset-colors"></div><label class="custom-brush" title="自定义画笔颜色"><span class="custom-swatch" aria-hidden="true">＋</span><span class="color-name">自定义</span><input id="custom-color" type="color" value="#b84984" aria-label="选择自定义画笔颜色"></label></div>
    </section>
    <div class="selection-actions floating" id="selection-actions" hidden>
      <button id="edit-selected">编辑</button><button id="delete-selected" title="删除选中的对象">删除</button>
      <label for="object-layer">所在图层</label><select id="object-layer" aria-label="选中对象所在图层"></select>
    </div>
    <div class="selection-actions floating" id="shape-actions" hidden>
      <span id="shape-count">已选 0 个图形</span>
      <button data-boolean="union" title="合并成一个区域">并集</button>
      <button data-boolean="subtract" title="先选中的图形保留，其余图形被减去">差集</button>
      <button data-boolean="intersect" title="只保留公共区域">交集</button>
      <button id="shape-clear" title="取消图形选择">取消</button>
      <button id="shape-delete" class="danger" title="删除选中图形">删除</button>
    </div>
    <aside class="layers-panel floating" id="layers-panel" aria-label="图层" hidden>
      <div class="inspector-heading"><h2>图层</h2><button id="close-layers" class="icon-action" aria-label="关闭图层">×</button></div>
      <p class="layer-help">新绘制的内容会加入当前图层</p>
      <div id="layer-list"></div>
      <div class="layer-actions"><button id="add-layer">＋ 新建图层</button><button id="layer-up" title="上移当前图层" aria-label="上移当前图层">↑</button><button id="layer-down" title="下移当前图层" aria-label="下移当前图层">↓</button><button id="delete-layer" title="删除图层，对象移入相邻图层" aria-label="删除当前图层">删除</button></div>
      <label class="layer-opacity" for="layer-opacity"><span>不透明度</span><output id="opacity-value">100%</output></label>
      <input id="layer-opacity" type="range" min="0" max="100" step="1" aria-label="当前图层不透明度">
    </aside>
    <aside class="inspector floating" id="inspector" aria-label="标注项" hidden>
      <div class="inspector-heading"><h2>标注项</h2><button id="close-inspector" class="icon-action" aria-label="关闭标注列表">×</button></div>
      <div id="annotations"></div>
    </aside>
    <div class="bottom-info"><span id="hint">在画布上拖动绘制</span></div>
    <div id="notice" class="notice floating" role="status"></div>
    <div id="legend" hidden><ul id="legend-items"></ul></div>
    <div class="project-actions" hidden></div>
  </main>
  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2 id="edit-title">编辑标注</h2>
      <label>类型<select name="kind"></select></label>
      <div class="color-edit">
        <label class="check"><input name="customColor" type="checkbox">自定义颜色</label>
        <input name="color" type="color" aria-label="标注颜色">
      </div>
      <label>标注<input name="label" maxlength="140" placeholder="例如：右侧上表面"></label>
      <div class="form-row">
        <label>数值<input name="value" type="number" step="any" inputmode="decimal"></label>
        <label>单位<input name="unit" maxlength="16" placeholder="N / Pa"></label>
      </div>
      <label>模型方向<input name="direction" maxlength="80" placeholder="例如：模型 −Z 或重力方向"></label>
      <label>待确认事项<input name="question" maxlength="200"></label>
      <label class="check"><input name="confirmed" type="checkbox">已确认</label>
      <div class="dialog-actions"><button class="danger" type="button" id="delete-mark">删除</button><span></span><button type="button" data-close>取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <dialog id="install-dialog"><section><h2>安装 SimSketch</h2><p>iPhone / iPad：在 Safari 分享菜单中选「添加到主屏幕」，并开启「作为网页 App 打开」。</p><p>Android 或桌面 Chrome / Edge：在浏览器菜单中选择安装应用。Mac Safari 也可以「添加到程序坞」。</p><div class="dialog-actions"><span></span><button class="primary" data-close>完成</button></div></section></dialog>
  <script type="module" src="./app.ts"></script>
</body>
</html>
